<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to My Coffee Shop</title>

  <style>
    body {
      font-family: Georgia, serif;
      text-align: center;
      background: #f5e6d3;
      color: #4b3025;
      padding: 60px 20px;
    }

    .container {
      background: #fffaf3;
      max-width: 600px;
      margin: auto;
      padding: 40px 25px;
      border-radius: 20px;
      box-shadow: 0 5px 15px #68452b30;
    }

    h1 {
      font-size: 38px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
    }

    button {
      background: #754c34;
      color: white;
      border: none;
      padding: 15px 25px;
      font-size: 17px;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #4b3025;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>☕ The Little Coffee Shop</h1>

    <p>
      Welcome to a cozy little corner of the world,
      where the coffee is warm and every cup has a story.
    </p>

    <p>
      Take a seat, relax, and discover what happens
      on an ordinary morning in a very special café.
    </p>

    <button onclick="window.location.href='story.html'">
      Enter the Coffee Shop ☕
    </button>
  </div>
</body>
</html>
